blueprint:
  name: IKEA Remote Control N2 - Bedroom lights
  description: >
    Top: press = all on at default level, hold = brighter.
    Bottom: press = all off, hold = dimmer.
    Left: press = toggle Jess, hold = cycle brightness Jess.
    Right: press = toggle Niels, hold = cycle brightness Niels.
  domain: automation
  input:
    remote:
      name: Remote
      selector:
        device:
          integration: zha
          manufacturer: IKEA of Sweden
          model: Remote Control N2
    light_jess:
      name: Nachtkastje Jess
      selector:
        entity:
          domain: light
    light_niels:
      name: Nachtkastje Niels
      selector:
        entity:
          domain: light
    light_third:
      name: Third light
      selector:
        entity:
          domain: light
    default_brightness:
      name: Brightness when switching on (%)
      description: Used whenever a light is turned on, regardless of its previous level.
      default: 40
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
    on_delay:
      name: Top-button press delay (ms)
      description: >
        Short wait before "all on" fires, so the stray "on" event that the
        remote sends when holding left/right can be ignored.
      default: 600
      selector:
        number:
          min: 0
          max: 2000
          unit_of_measurement: "ms"
          mode: box

mode: restart
max_exceeded: silent

variables:
  jess: !input light_jess
  niels: !input light_niels
  third: !input light_third
  default_pct: !input default_brightness
  on_delay: !input on_delay
  command: "{{ trigger.event.data.command }}"
  endpoint: "{{ trigger.event.data.endpoint_id | default(1) }}"
  args: "{{ trigger.event.data.args | default([]) }}"
  arg0: "{{ args[0] if (args is list and args | length > 0) else none }}"

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote

actions:
  - choose:
      # ---- TOP: press = all on at default level ----
      - conditions: "{{ command == 'on' }}"
        sequence:
          # A hold on left/right sends a stray "on" first; if a hold event
          # follows within this delay, restart mode cancels this run.
          - delay: { milliseconds: "{{ on_delay }}" }
          - action: light.turn_on
            target:
              entity_id: ["{{ jess }}", "{{ niels }}", "{{ third }}"]
            data:
              brightness_pct: "{{ default_pct }}"

      # ---- TOP: hold = brighter ----
      - conditions: "{{ command == 'move_with_on_off' }}"
        sequence:
          - repeat:
              count: 30
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: ["{{ jess }}", "{{ niels }}", "{{ third }}"]
                  data:
                    brightness_step_pct: 7
                    transition: 0.3
                - delay: { milliseconds: 300 }

      # ---- BOTTOM: press = all off ----
      - conditions: "{{ command == 'off' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: ["{{ jess }}", "{{ niels }}", "{{ third }}"]

      # ---- BOTTOM: hold = dimmer ----
      - conditions: "{{ command == 'move' }}"
        sequence:
          - repeat:
              count: 30
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: ["{{ jess }}", "{{ niels }}", "{{ third }}"]
                  data:
                    brightness_step_pct: -7
                    transition: 0.3
                - delay: { milliseconds: 300 }

      # ---- LEFT: press = toggle Jess ----
      - conditions: "{{ command == 'arrow_left_click' or (command == 'press' and arg0 == 257) }}"
        sequence:
          - choose:
              - conditions: "{{ is_state(jess, 'on') }}"
                sequence:
                  - action: light.turn_off
                    target: { entity_id: "{{ jess }}" }
            default:
              - action: light.turn_on
                target: { entity_id: "{{ jess }}" }
                data: { brightness_pct: "{{ default_pct }}" }

      # ---- LEFT: hold = cycle brightness Jess ----
      - conditions: "{{ command == 'arrow_left_hold' or (command == 'hold' and arg0 == 3329) }}"
        sequence:
          - repeat:
              count: 40
              sequence:
                - choose:
                    - conditions: "{{ is_state(jess, 'off') }}"
                      sequence:
                        - action: light.turn_on
                          target: { entity_id: "{{ jess }}" }
                          data: { brightness_pct: "{{ default_pct }}" }
                    - conditions: "{{ state_attr(jess, 'brightness') | int(0) >= 250 }}"
                      sequence:
                        - action: light.turn_on
                          target: { entity_id: "{{ jess }}" }
                          data: { brightness_pct: 5 }
                  default:
                    - action: light.turn_on
                      target: { entity_id: "{{ jess }}" }
                      data: { brightness_step_pct: 10 }
                - delay: { milliseconds: 400 }

      # ---- RIGHT:
