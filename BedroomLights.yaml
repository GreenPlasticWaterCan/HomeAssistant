version: 1.0
name: Custom IKEA Remote
description: |
  Maps your 4-button remote to:
  Top Short: Turn ON all | Hold: Dim UP all
  Bottom Short: Turn OFF all | Hold: Dim DOWN all
  Left Short: Toggle Jess | Hold: Dim DOWN Jess
  Right Short: Toggle Niels | Hold: Dim DOWN Niels

