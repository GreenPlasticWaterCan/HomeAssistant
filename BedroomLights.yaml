blueprint:
  name: IKEA Remote Control N2 - Bedroom lights
  description: >
    Top: press = all on, hold = brighter.
    Bottom: press = all off, hold = dimmer.
    Left: press = toggle Jess, hold = cycle brightness Jess.
    Right: press = toggle Niels, hold = cycle brightness Niels.
  domain: automation
  input:
    remote:
      name: Remote
      selector:
        device:
          integration: zha
          manufacturer: IKEA of Sweden
          model: Remote Control N2
    light_jess:
      name: Nachtkastje Jess
      selector:
        entity:
          domain: light
    light_niels:
      name: Nachtkastje Niels
      selector:
        entity:
          domain: light
    light_third:
      name: Third light
      selector:
        entity:
          domain: light

# Restart mode: the release event cancels any running hold loop
mode: restart
max_exceeded: silent

variables:
  jess: !input light_jess
  niels: !input light_niels
  third: !input light_third
  command: "{{ trigger.event.data.command }}"
  endpoint: "{{ trigger.event.data.endpoint_id | default(1) }}"

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote

actions:
  - choose:
      # ---- TOP: press = all on ----
      - conditions: "{{ command == 'on' and endpoint == 1 }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: ["{{ jess }}", "{{ niels }}", "{{ third }}"]

      # ---- TOP: hold = brighter ----
      - conditions: "{{ command == 'move_with_on_off' }}"
        sequence:
          - repeat:
              count: 30
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: ["{{ jess }}", "{{ niels }}", "{{ third }}"]
                  data:
                    brightness_step_pct: 7
                    transition: 0.3
                - delay: { milliseconds: 300 }

      # ---- BOTTOM: press = all off ----
      - conditions: "{{ command == 'off' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: ["{{ jess }}", "{{ niels }}", "{{ third }}"]

      # ---- BOTTOM: hold = dimmer ----
      - conditions: "{{ command == 'move' }}"
        sequence:
          - repeat:
              count: 30
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: ["{{ jess }}", "{{ niels }}", "{{ third }}"]
                  data:
                    brightness_step_pct: -7
                    transition: 0.3
                - delay: { milliseconds: 300 }

      # ---- LEFT: press = toggle Jess ----
      - conditions: "{{ command == 'arrow_left_click' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ jess }}"

      # ---- LEFT: hold = cycle brightness Jess ----
      - conditions: "{{ command == 'arrow_left_hold' }}"
        sequence:
          - repeat:
              count: 40
              sequence:
                - choose:
                    - conditions: "{{ state_attr(jess, 'brightness') | int(0) >= 250 }}"
                      sequence:
                        - action: light.turn_on
                          target: { entity_id: "{{ jess }}" }
                          data: { brightness_pct: 5 }
                  default:
                    - action: light.turn_on
                      target: { entity_id: "{{ jess }}" }
                      data: { brightness_step_pct: 10 }
                - delay: { milliseconds: 400 }

      # ---- RIGHT: press = toggle Niels ----
      - conditions: "{{ command == 'arrow_right_click' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ niels }}"

      # ---- RIGHT: hold = cycle brightness Niels ----
      - conditions: "{{ command == 'arrow_right_hold' }}"
        sequence:
          - repeat:
              count: 40
              sequence:
                - choose:
                    - conditions: "{{ state_attr(niels, 'brightness') | int(0) >= 250 }}"
                      sequence:
                        - action: light.turn_on
                          target: { entity_id: "{{ niels }}" }
                          data: { brightness_pct: 5 }
                  default:
                    - action: light.turn_on
                      target: { entity_id: "{{ niels }}" }
                      data: { brightness_step_pct: 10 }
                - delay: { milliseconds: 400 }

      # ---- Any release event just stops the running loop ----
      - conditions: "{{ command in ['stop_with_on_off', 'stop', 'arrow_left_release', 'arrow_right_release'] }}"
        sequence:
          - stop: "Button released"
